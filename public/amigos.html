<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigos y chat · EL CENDERO DE LOS AR🌙ANGELES</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6331831674832770" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/estilo.css?v=39">
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="/"><span>☾</span> EL CENDERO DE LOS AR🌙ANGELES</a>
      <nav class="menu">
        <a href="/tarot.html">Tarot</a>
        <a href="/blog.html">Blog</a>
        <a href="/amigos.html">Amigos</a>
        <div id="zona-usuario"></div>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <section class="titulo-seccion" style="margin-top:50px">
      <div class="deco">💬</div>
      <h2>Amigos y chat</h2>
      <p id="bienvenida-amigos">Conecta con tu círculo y conversa en un espacio sagrado.</p>
    </section>

    <div class="amigos-layout">
      <aside class="amigos-side">
        <div class="amigos-tabs">
          <button class="amigos-tab activo" data-tab="contactos">👥 Amigos</button>
          <button class="amigos-tab" data-tab="solicitudes">⭐ Solicitudes <span class="amigo-badge oculto" id="cont-solicitudes">0</span></button>
          <button class="amigos-tab" data-tab="buscar">🔍 Buscar</button>
        </div>
        <div id="lista-contactos"></div>
        <div id="vista-solicitudes" class="oculto"></div>
        <div id="vista-buscar" class="oculto">
          <div class="campo">
            <input type="text" id="busqueda" placeholder="Busca por nombre o correo..." aria-label="Buscar personas">
          </div>
          <div id="resultados-busqueda"></div>
        </div>
      </aside>

      <section class="chat-caja t-aurora" id="chat-caja">
        <div class="chat-cabecera" id="chat-cabecera">
          <div class="contacto-avatar">✨</div>
          <div>
            <div class="chat-nombre" id="chat-nombre">Tu rincón</div>
            <div class="chat-estado" id="chat-estado">Elige una amistad para abrir su chat</div>
          </div>
          <div class="chat-herramientas oculto" id="chat-herramientas">
            <select class="chat-fuente" id="chat-fuente" aria-label="Tipo de letra del chat">
              <option value="serifa">Serifa ✒️</option>
              <option value="manuscrita">Manuscrita 🌿</option>
              <option value="romantica">Romántica 💝</option>
              <option value="biografia">Biografía 📜</option>
              <option value="mono">Consola ⌨️</option>
            </select>
            <div class="chat-temas" id="chat-temas" title="Tema de color del chat"></div>
          </div>
        </div>

        <div class="chat-mensajes" id="chat-mensajes">
          <div class="chat-vacio">
            <div class="deco">🌙</div>
            <p>Tu círculo te espera.<br>Elige a una amistad para iniciar la conversación.</p>
          </div>
        </div>

        <div class="chat-emoji oculto" id="chat-emoji">
          <span title="✨">✨</span><span title="🔮">🔮</span><span title="💛">💛</span>
          <span title="🌙">🌙</span><span title="⭐">⭐</span><span title="🕊️">🕊️</span>
          <span title="💜">💜</span><span title="❤️">❤️</span><span title="😊">😊</span>
          <span title="🙏">🙏</span>
        </div>
        <div class="chat-entrada oculto" id="chat-entrada">
          <textarea id="chat-texto" rows="1" maxlength="2000" placeholder="Escribe un mensaje..." aria-label="Mensaje"></textarea>
          <button class="btn-enviar" id="btn-enviar" aria-label="Enviar mensaje">Enviar ✦</button>
        </div>
      </section>
    </div>
    <div class="aviso-chat" id="aviso-chat"></div>
  </main>

  <footer class="pie">
    <div class="logo"><span>☾</span> EL CENDERO DE LOS AR🌙ANGELES</div>
  </footer>

  <script src="/js/app.js?v=14"></script>
  <script src="/js/amigos.js?v=1"></script>
</body>
</html>
