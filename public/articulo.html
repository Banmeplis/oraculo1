<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo · EL CENDERO DE LOS AR🌙ANGELES</title>
  <meta name="description" content="Artículo de tarot, espiritualidad y guía angelical de EL CENDERO DE LOS AR🌙ANGELES.">
  <meta name="keywords" content="tarot, espiritualidad, rituales, arcángeles, luna, sol, portales energéticos">
  <meta name="author" content="EL CENDERO DE LOS AR🌙ANGELES">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="EL CENDERO DE LOS AR🌙ANGELES">
  <meta property="og:title" content="Artículo · EL CENDERO DE LOS AR🌙ANGELES">
  <meta property="og:description" content="Información práctica sobre espiritualidad, rituales, arcángeles, luna y sol.">
  <meta property="og:url" content="https://oraculo1-hhwc.onrender.com/articulo.html">
  <meta property="og:image" content="https://oraculo1-hhwc.onrender.com/og-imagen.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Artículo · EL CENDERO DE LOS AR🌙ANGELES">
  <meta name="twitter:description" content="Información práctica sobre espiritualidad, rituales, arcángeles, luna y sol.">
  <link id="canonical-articulo" rel="canonical" href="https://oraculo1-hhwc.onrender.com/articulo.html">
  <script id="datos-articulo" type="application/ld+json">{}</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <link rel="stylesheet" href="/css/estilo.css?v=17">
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="/"><span>☾</span> EL CENDERO DE LOS AR🌙ANGELES</a>
      <nav class="menu">
        <a href="/tarot.html">Tarot</a>
        <a href="/blog.html">Blog</a>
        <div id="zona-usuario"></div>
      </nav>
    </div>
  </header>

  <main class="contenedor" style="max-width:820px">
    <div id="articulo" class="oculto">
      <div class="articulo-cabecera">
        <h1 id="a-titulo"></h1>
        <div class="meta" id="a-meta"></div>
      </div>
      <nav style="display:flex;gap:12px;justify-content:center">
        <a class="btn btn-suave" href="/blog.html">← Volver al blog</a>
      </nav>
        <div id="a-contenido"></div>
    </div>
    <div class="centrado oculto" id="a-vacio" style="padding:70px 0">
      <p style="color:var(--lavanda-suave)">El artículo no fue encontrado.</p>
      <a class="btn btn-dorado" href="/blog.html">Ir al blog</a>
    </div>

    <section id="relacionados-seccion" class="oculto relacionados-articulos">
      <div class="titulo-seccion" style="margin-top:54px;margin-bottom:22px">
        <div class="deco">✧ ✦ ✧</div>
        <h2>También te puede interesar</h2>
        <p>Continúa explorando información y prácticas relacionadas.</p>
      </div>
      <div id="articulos-relacionados" class="rejilla rejilla-3"></div>
    </section>

    <section id="comentarios-seccion" class="oculto" style="margin-top:40px">
      <div class="titulo-seccion" style="margin-top:0;margin-bottom:20px">
        <div class="deco">💬</div>
        <h2>Comentarios</h2>
        <p id="cuenta-comentarios"></p>
      </div>
      <div id="lista-comentarios"></div>
      <div class="tarjeta" style="margin-top:20px" id="form-comentario-box">
        <h3 style="margin-bottom:14px;font-size:1.1rem">Deja tu comentario</h3>
        <div id="aviso-comentario"></div>
        <div class="campo">
          <textarea id="c-cuerpo" placeholder="Comparte tu opinión..." style="min-height:100px"></textarea>
        </div>
        <div class="centrado">
          <button class="btn btn-dorado" id="btn-comentar">Enviar comentario</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="logo"><span>☾</span> EL CENDERO DE LOS AR🌙ANGELES</div>
    <p>Que la luz te acompañe</p>
  </footer>

  <script src="/js/app.js?v=13"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");

    function optimizarSEO(post) {
      const grupos = [
        { coincide: /vela|ritual/i, palabras: ["ritual con velas", "seguridad con velas", "vela blanca", "vela dorada", "limpieza energética"] },
        { coincide: /arcángel/i, palabras: ["arcángeles", "Arcángel Miguel", "Arcángel Rafael", "Arcángel Gabriel", "guía espiritual"] },
        { coincide: /portal/i, palabras: ["portales energéticos", "portal 11:11", "equinoccio", "solsticio", "intención espiritual"] },
        { coincide: /luna|cuarto creciente/i, palabras: ["fases de la luna", "luna nueva", "luna llena", "ciclo lunar", "ritual lunar"] },
        { coincide: /sol|solar/i, palabras: ["energía solar", "Sol", "solsticio", "vitalidad", "observación segura del Sol"] }
      ];
      const grupo = grupos.find(item => item.coincide.test(post.titulo + " " + post.cuerpo)) || grupos[2];
      const descripcion = (post.resumen || post.cuerpo || "").replace(/\s+/g, " ").trim().slice(0, 155);
      const url = `${location.origin}/articulo.html?id=${post.id}`;
      document.title = `${post.titulo} · EL CENDERO DE LOS AR🌙ANGELES`;
      document.querySelector('meta[name="description"]').setAttribute("content", descripcion);
      document.querySelector('meta[name="keywords"]').setAttribute("content", grupo.palabras.join(", "));
      document.querySelector('meta[property="og:title"]').setAttribute("content", post.titulo);
      document.querySelector('meta[property="og:description"]').setAttribute("content", descripcion);
      document.querySelector('meta[property="og:url"]').setAttribute("content", url);
      document.querySelector('meta[property="og:image"]').setAttribute("content", post.portada || `${location.origin}/og-imagen.png`);
      document.querySelector('meta[name="twitter:title"]').setAttribute("content", post.titulo);
      document.querySelector('meta[name="twitter:description"]').setAttribute("content", descripcion);
      document.getElementById("canonical-articulo").setAttribute("href", url);
      document.getElementById("datos-articulo").textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        headline: post.titulo,
        description: descripcion,
        image: post.portada ? [post.portada] : [],
        author: { "@type": "Person", name: post.autor },
        publisher: { "@type": "Organization", name: "EL CENDERO DE LOS AR🌙ANGELES" },
        datePublished: post.creado_en,
        dateModified: post.actualizado || post.creado_en,
        mainEntityOfPage: url,
        keywords: grupo.palabras
      });
    }

    fetch("/api/posts/" + id)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(p => {
        optimizarSEO(p);
        document.getElementById("articulo").classList.remove("oculto");
        document.getElementById("a-titulo").textContent = p.titulo;
        document.getElementById("a-meta").innerHTML =
          `✧ ${p.autor} · ${fechaLegible(p.creado_en)}` +
          (p.video ? " · incluye video" : "");
        let c = "";
        if (p.portada) c += `<img class="articulo-portada" src="${p.portada}" alt="${p.titulo}">`;
        if (p.video) c += `<div class="centrado"><video controls style="max-width:100%;border-radius:16px;margin:20px 0">
          <source src="${p.video}"></video></div>`;
        c += `<div class="articulo-cuerpo">${marcarComoHTML(p.cuerpo || "")}</div>`;
        document.getElementById("a-contenido").innerHTML = c;
        cargarRelacionados(p.id);
      })
      .catch(() => document.getElementById("a-vacio").classList.remove("oculto"));

    async function cargarRelacionados(actualId) {
      try {
        const posts = await fetchJSON("/api/posts");
        const relacionados = posts.filter(post => post.id !== Number(actualId)).slice(0, 3);
        const caja = document.getElementById("articulos-relacionados");
        if (!relacionados.length) return;
        caja.innerHTML = relacionados.map(post => `
          <article class="tarjeta post relacionado-post">
            ${post.portada ? `<img class="portada" src="${post.portada}" alt="${escapHtml(post.titulo)}" loading="lazy">` : ""}
            <div class="cuerpo-post">
              <h3><a href="/articulo.html?id=${post.id}">${escapHtml(post.titulo)}</a></h3>
              <p class="resumen">${escapHtml(post.resumen || "")}</p>
              <a class="leer-mas" href="/articulo.html?id=${post.id}">Leer artículo →</a>
            </div>
          </article>`).join("");
        document.getElementById("relacionados-seccion").classList.remove("oculto");
      } catch {}
    }

    /* ------------------------- comentarios ------------------------- */
    let postId = id;
    const seccion = document.getElementById("comentarios-seccion");
    const lista = document.getElementById("lista-comentarios");
    const avisoC = document.getElementById("aviso-comentario");

    async function cargarComentarios() {
      try {
        const coms = await fetchJSON("/api/posts/" + postId + "/comentarios");
        document.getElementById("cuenta-comentarios").textContent =
          (coms.length === 1 ? "1 comentario" : coms.length + " comentarios");
        if (!coms.length) {
          lista.innerHTML = '<p class="centrado" style="color:var(--lavanda-suave)">Aún no hay comentarios. Sé la primera en compartir.</p>';
        } else {
          lista.innerHTML = coms.map(c => `
            <div class="comentario vidrio">
              <div class="comentario-cab">
                <span class="comentario-autor">${escapHtml(c.autor)}</span>
                <span class="comentario-fecha">${fechaLegible(c.creado_en)}</span>
                ${(SESION.usuario && (c.user_id === SESION.usuario.id || SESION.usuario.rol === "admin")) ?
                  `<button class="btn btn-suave" style="padding:4px 12px;font-size:.8rem" data-borrar-com="${c.id}">Eliminar</button>` : ""}
              </div>
              <p>${escapHtml(c.cuerpo)}</p>
            </div>`).join("");
          lista.querySelectorAll("[data-borrar-com]").forEach(b => b.addEventListener("click", async () => {
            if (!confirm("¿Eliminar este comentario?")) return;
            try { await fetchJSON("/api/comentarios/" + b.dataset.borrarCom, { method: "DELETE" }); cargarComentarios(); }
            catch (e) { avisoC.innerHTML = '<div class="aviso error">' + e.message + '</div>'; }
          }));
        }
      } catch (e) { lista.innerHTML = '<div class="aviso error">' + e.message + '</div>'; }
    }

    document.getElementById("btn-comentar").addEventListener("click", async () => {
      const cuerpo = document.getElementById("c-cuerpo").value.trim();
      if (!cuerpo) { avisoC.innerHTML = '<div class="aviso error">Escribe un comentario</div>'; return; }
      try {
        await fetchJSON("/api/posts/" + postId + "/comentarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cuerpo })
        });
        avisoC.innerHTML = '<div class="aviso ok">Comentario publicado ✓</div>';
        document.getElementById("c-cuerpo").value = "";
        cargarComentarios();
      } catch (e) { avisoC.innerHTML = '<div class="aviso error">' + e.message + '</div>'; }
    });

    /* mostramos comentarios al cargar el artículo */
    window.addEventListener("load", () => {
      seccion.classList.remove("oculto");
      cargarComentarios();
    });
  </script>
</body>
</html>
